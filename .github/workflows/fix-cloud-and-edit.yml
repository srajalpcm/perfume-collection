name: Fix cloud boot and edit handler
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application boot and edit wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_init = """async function initCloud(){try{if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Supabase'));document.head.appendChild(s)})}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data}=await sb.auth.getSession();sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){currentUser=null;perfumes=[];showAuth('You have been signed out.','success')}});if(data.session)await hydrateCloud();else showAuth()}catch(e){showAuth('Could not connect to your cloud account. '+e.message,'error')}}"""

          new_init = """async function initCloud(){try{const local=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(Array.isArray(local)&&local.length){perfumes=local;go('dashboard')}if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Supabase'));document.head.appendChild(s)})}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data}=await sb.auth.getSession();sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){currentUser=null;perfumes=[];localStorage.removeItem(STORAGE);showAuth('You have been signed out.','success')}});if(data.session)await hydrateCloud(data.session);else showAuth()}catch(e){console.error(e);if(perfumes.length){toast('Cloud sync could not be refreshed. Your saved collection is still available on this device.','error')}else showAuth('Could not connect to your cloud account. '+e.message,'error')}}"""

          if old_init not in s:
              raise SystemExit('Could not find initCloud block')
          s=s.replace(old_init,new_init,1)

          old_hyd = """async function hydrateCloud(){const {data,error}=await sb.auth.getUser();if(error)throw error;currentUser=data.user;if(!currentUser){showAuth();return}updateProfile();const {data:cloud,error:fetchErr}=await sb.from('perfumes').select('*').order('created_at',{ascending:true});if(fetchErr)throw fetchErr;const local=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(!(cloud||[]).length&&local.length){if(confirm('Your cloud collection is empty, but this device already has perfumes. Upload this local collection to your account?')){perfumes=local;await saveData();toast('Local collection uploaded to cloud','success')}else perfumes=[]}else perfumes=(cloud||[]).map(fromCloudRow);localStorage.setItem(STORAGE,JSON.stringify(perfumes));$('authGate').classList.add('hidden');go('dashboard')}"""

          new_hyd = """async function hydrateCloud(session=null){const s=session||((await sb.auth.getSession()).data.session);if(!s||!s.user){showAuth();return}currentUser=s.user;updateProfile();$('authGate').classList.add('hidden');go('dashboard');const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+s.access_token,Accept:'application/json'};const url=SUPABASE_URL+'/rest/v1/perfumes?select=*&order=created_at.asc';const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(url,{headers,signal:ctl.signal});if(!r.ok)throw new Error('Cloud collection request failed ('+r.status+')');const cloud=await r.json();perfumes=Array.isArray(cloud)?cloud.map(fromCloudRow):[];localStorage.setItem(STORAGE,JSON.stringify(perfumes));renderDashboard();}catch(e){console.error(e);if(!perfumes.length)throw e;toast('Showing your saved collection while cloud sync reconnects.','error')}finally{clearTimeout(timer)}}"""

          if old_hyd not in s:
              raise SystemExit('Could not find hydrateCloud block')
          s=s.replace(old_hyd,new_hyd,1)

          tag='<script src="./edit-fix.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Fix cloud boot and edit handler [skip ci]'
          git push
name: Fix perfume image containment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-images:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bottle image containment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.bottle{position:relative;height:285px;background:linear-gradient(180deg,#f6f0e9,#eee6dd);display:grid;place-items:center;padding:20px}'
          new = '.bottle{position:relative;height:285px;background:linear-gradient(180deg,#f6f0e9,#eee6dd);display:grid;place-items:center;padding:20px;overflow:hidden;isolation:isolate}'
          old2 = '.bottle img{width:100%;height:100%;object-fit:contain;transition:.2s}'
          new2 = '.bottle img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center;transition:.2s;flex:none}'
          if old in s:
              s = s.replace(old, new, 1)
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix perfume bottle image containment [skip ci]'
          git push

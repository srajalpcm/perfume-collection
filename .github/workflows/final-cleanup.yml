name: Final site cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete sync injector references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          markers=['<script src="supabase-sync.js"></script>','<script src="./supabase-sync.js"></script>']
          for marker in markers:
              s=s.replace(marker,'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then echo "Already clean"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove obsolete cloud sync loader"
          git push

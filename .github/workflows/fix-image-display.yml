name: Fix image display
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix bottle image sizing and View button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\.bottle\{[^}]*\}', '.bottle{position:relative;height:285px;background:linear-gradient(180deg,#f6f0e9,#eee6dd);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;isolation:isolate}', s, count=1)
          s = re.sub(r'\.bottle img\{[^}]*\}', '.bottle img{display:block;width:auto !important;height:auto !important;max-width:100% !important;max-height:100% !important;object-fit:contain;object-position:center;flex:0 0 auto;transition:transform .2s}', s, count=1)
          extra = '.card-foot .btn:first-child,.row-actions .btn:first-child{background:#8b5e43;color:#fff;border-color:#8b5e43}.card-foot .btn:first-child:hover,.row-actions .btn:first-child:hover{background:#744a34;border-color:#744a34}'
          if extra not in s:
              s = s.replace('</style>', extra + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Improve bottle image fitting and view button [skip ci]'
          git push

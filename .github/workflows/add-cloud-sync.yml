name: Keep site clean
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-legacy-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove legacy Supabase sync script tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="supabase-sync.js"></script>'
          cleaned=s.replace(marker, '')
          if cleaned != s:
              p.write_text(cleaned, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy cloud sync script"
          git push

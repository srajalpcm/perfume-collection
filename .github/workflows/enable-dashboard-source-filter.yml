name: Enable dashboard source filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message != 'Enable dashboard source filter loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dashboard filter script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./dashboard-filter.js?v=2"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Closing body tag not found')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable dashboard source filter loader'
          git push